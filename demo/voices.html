<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Picker</title>
<style>
:root { --bg: #f7f5f0; --card: #fff; --ink: #1d1b18; --muted: #6f6a62; --line: #2b5fd9; --border: #e4e0d8; --keep: #1e8a4c; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #141312; --card: #1e1d1b; --ink: #f1eee8; --muted: #a39e95; --line: #7aa2ff; --border: #33312d; --keep: #4cc27f; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif; }
main { max-width: 980px; margin: 0 auto; padding: 32px 16px 96px; }
header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 18px; font-weight: 600; margin: 0; }
h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 32px 0 12px; }
a { color: var(--line); }
.muted { color: var(--muted); font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.v { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
     display: flex; flex-direction: column; gap: 8px; }
.v.keep { border-color: var(--keep); box-shadow: 0 0 0 1px var(--keep) inset; }
.name { font-size: 16px; font-weight: 600; }
.meta { font-size: 12px; color: var(--muted); }
.row { display: flex; justify-content: space-between; align-items: center; }
button { font: inherit; font-size: 13px; border-radius: 999px; padding: 5px 12px; cursor: pointer;
         border: 1px solid var(--border); background: var(--card); color: var(--ink); }
button.playing { background: var(--line); color: #fff; border-color: var(--line); }
button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); font-size: 15px; padding: 10px 20px; }
label { font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
.bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border);
       padding: 12px 16px; display: flex; justify-content: center; gap: 16px; align-items: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Voice Picker</h1>
    <span class="muted">Sample: 今日はいい天気ですね。明日は雨が降るそうです。 · <a href="/">← back to practice</a></span>
  </header>
  <p class="muted">Split by measured pitch (median F0; under 165 Hz = male). Borderline voices are worth a listen either way. First play of a voice takes a second or two to load.</p>
  <h2 id="mh">Male</h2><div class="grid" id="M"></div>
  <h2 id="fh">Female</h2><div class="grid" id="F"></div>
</main>
<div class="bar"><span class="muted" id="count"></span><button class="primary" id="save">Save selection</button><span class="muted" id="saved"></span></div>
<script>
const $ = id => document.getElementById(id);
let player = null, cat = [];
function card(v) {
  return `<div class="v ${v.keep ? "keep" : ""}" id="c${v.id}">
    <div class="name">${v.name}</div>
    <div class="meta">${v.style} · ${v.f0} Hz</div>
    <div class="row"><button data-id="${v.id}">▶ Play</button>
      <label><input type="checkbox" data-id="${v.id}" ${v.keep ? "checked" : ""}> Keep</label></div></div>`;
}
function count() {
  const k = cat.filter(v => v.keep);
  $("count").textContent = `${k.length} kept (${k.filter(v => v.gender === "M").length} male, ${k.filter(v => v.gender === "F").length} female)`;
}
async function load() {
  cat = await (await fetch("/api/catalog")).json();
  for (const g of ["M", "F"]) $(g).innerHTML = cat.filter(v => v.gender === g).map(card).join("");
  $("mh").textContent = `Male (${cat.filter(v => v.gender === "M").length})`;
  $("fh").textContent = `Female (${cat.filter(v => v.gender === "F").length})`;
  document.querySelectorAll("button[data-id]").forEach(b => b.onclick = () => {
    document.querySelectorAll("button.playing").forEach(x => x.classList.remove("playing"));
    if (player) player.pause();
    b.classList.add("playing");
    player = new Audio(`/api/sample?voice=${b.dataset.id}`);
    player.onended = player.onpause = () => b.classList.remove("playing");
    player.play();
  });
  document.querySelectorAll("input[data-id]").forEach(c => c.onchange = () => {
    const v = cat.find(v => v.id == c.dataset.id); v.keep = c.checked;
    $("c" + v.id).classList.toggle("keep", c.checked); $("saved").textContent = ""; count();
  });
  count();
}
$("save").onclick = async () => {
  const ids = cat.filter(v => v.keep).map(v => v.id);
  const r = await (await fetch("/api/voices/keep", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(ids) })).json();
  $("saved").textContent = `Saved ${r.saved} ✓`;
};
load();
</script>
</body>
</html>
