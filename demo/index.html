<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitch Accent Check</title>
<style>
:root {
  --bg: #f7f5f0; --card: #ffffff; --ink: #1d1b18; --muted: #6f6a62; --line: #2b5fd9;
  --ok: #1e8a4c; --bad: #d23b3b; --bad-bg: #fde8e8; --unsure: #9a958c; --border: #e4e0d8;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141312; --card: #1e1d1b; --ink: #f1eee8; --muted: #a39e95; --line: #7aa2ff;
          --ok: #4cc27f; --bad: #ff6b6b; --bad-bg: #3a1f1f; --unsure: #77726a; --border: #33312d; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif; }
main { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: .02em; }
.muted { color: var(--muted); font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 28px 24px; margin-top: 20px; }
.sentence { font-size: 30px; line-height: 2.3; }
ruby rt { font-size: 13px; color: var(--muted); }
.controls { display: flex; gap: 10px; align-items: center; margin-top: 24px; flex-wrap: wrap; }
button { font: inherit; font-size: 15px; border-radius: 999px; padding: 10px 20px; cursor: pointer;
         border: 1px solid var(--border); background: var(--card); color: var(--ink); }
button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button.rec { background: var(--bad); color: #fff; border-color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #fff; margin-right: 8px;
       animation: pulse 1s infinite; vertical-align: 1px; }
@keyframes pulse { 50% { opacity: .3; } }
.score { font-size: 44px; font-weight: 700; }
.score small { font-size: 15px; font-weight: 400; color: var(--muted); margin-left: 8px; }
.rowlabel { display: flex; align-items: center; gap: 10px; margin: 26px 0 8px; font-size: 13px; color: var(--muted);
            text-transform: uppercase; letter-spacing: .08em; }
.rowlabel button { padding: 4px 12px; font-size: 13px; text-transform: none; letter-spacing: 0; }
.pitchrow { display: flex; flex-wrap: wrap; gap: 14px 18px; font-size: 24px; }
.phrase { display: inline-flex; padding-top: 4px; position: relative; }
.m { padding: 6px 3px 6px; border-top: 2px solid transparent; border-bottom: 2px solid transparent; line-height: 1; }
.m.H { border-top-color: var(--line); }
.m.L { border-bottom-color: var(--line); }
.m.step { border-left: 2px solid var(--line); }
.heard .ok .m.H { border-top-color: var(--ok); } .heard .ok .m.L { border-bottom-color: var(--ok); } .heard .ok .m.step { border-left-color: var(--ok); }
.heard .unsure .m { opacity: .55; }
.heard .unsure .m.H, .heard .unsure .m.L { border-style: dashed; border-color: var(--unsure); border-left-color: transparent; border-right-color: transparent; }
.heard .unsure .m.H { border-bottom-color: transparent; } .heard .unsure .m.L { border-top-color: transparent; }
.heard .unsure .m.step { border-left: 2px dashed var(--unsure); }
.heard .m.bad { background: var(--bad-bg); color: var(--bad); border-radius: 4px; }
.heard .m.bad.H { border-top-color: var(--bad); } .heard .m.bad.L { border-bottom-color: var(--bad); } .heard .m.bad.step { border-left-color: var(--bad); }
.phrase.hastip { cursor: help; border-radius: 6px; }
.phrase.hastip:hover, .phrase.hastip:focus { background: color-mix(in srgb, var(--line) 10%, transparent); outline: none; }
.tip { display: none; position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); z-index: 5;
       background: var(--ink); color: var(--bg); border-radius: 8px; padding: 8px 12px; font-size: 13px; line-height: 1.5;
       white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.18); pointer-events: none; }
.tip::after { content: ""; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
              border: 6px solid transparent; border-top-color: var(--ink); }
.tip b { display: block; font-size: 15px; }
.tip i { font-style: normal; opacity: .75; }
.tipnote { display: block; opacity: .7; font-size: 12px; }
.tipsep { display: block; border-top: 1px solid color-mix(in srgb, var(--bg) 30%, transparent); margin: 6px 0 4px; }
.tipgloss { display: block; white-space: normal; max-width: 300px; font-size: 12.5px; }
.tipgloss .tw { opacity: .7; margin-right: 6px; }
.tip { white-space: normal; min-width: 160px; max-width: 320px; }
.phrase.hastip:hover .tip, .phrase.hastip:focus .tip { display: block; }
.modes { display: flex; gap: 0; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
.modes button { border: 0; border-radius: 0; padding: 6px 14px; font-size: 13px; }
.modes button.on { background: var(--ink); color: var(--bg); }
#particle { font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--ink); }
.meaning { color: var(--muted); font-size: 15px; margin-top: -6px; }
.members { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 4px; }
.member { border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; min-width: 110px; }
.member.target { border-color: var(--line); box-shadow: 0 0 0 1px var(--line) inset; }
.member .w { font-size: 22px; } .member .r { font-size: 12px; color: var(--muted); } .member .g { font-size: 12px; color: var(--muted); max-width: 180px; }
.member .say { font-size: 11px; color: var(--line); font-weight: 600; letter-spacing: .05em; }
.pairres { font-size: 18px; margin: 14px 0 0; }
.heard .context .m { opacity: .4; }
.heard .context .m.H, .heard .context .m.L, .heard .context .m.step { border-color: transparent !important; }
.levels { display: flex; gap: 4px; flex-wrap: wrap; }
.levels button { padding: 4px 10px; font-size: 13px; }
.levels button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.levels small { opacity: .6; margin-left: 3px; font-size: 11px; }
.lvbadge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border);
           color: var(--muted); margin-bottom: 6px; }
.badge { position: absolute; top: -12px; right: -6px; font-size: 11px; color: var(--unsure); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 22px; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 3px; margin-right: 6px; vertical-align: middle; }
.legend .l-ok::before { background: var(--ok); } .legend .l-bad::before { background: var(--bad); }
.legend .l-un::before { background: var(--unsure); }
.voices { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
.voices button { padding: 5px 12px; font-size: 13px; }
.voices button.playing { background: var(--line); border-color: var(--line); color: #fff; }
.heardkana { margin-top: 18px; font-size: 13px; color: var(--muted); }
.error { color: var(--bad); margin-top: 16px; }
select { font: inherit; font-size: 14px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border);
         background: var(--card); color: var(--ink); }
@media (max-width: 560px) { .sentence { font-size: 24px; } .pitchrow { font-size: 20px; } .card { padding: 22px 16px; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="modes" id="modes">
      <button data-m="sentence">Sentences</button><button data-m="word">Words</button><button data-m="pair">Minimal pairs</button>
    </div>
    <select id="particle" title="Word mode: what to say after the word">
      <option value="carrier">word + particle + follow-up</option>
      <option value="particle">word + particle</option>
      <option value="word">word only</option>
    </select>
    <div class="levels" id="levels"></div>
    <h1 style="order:-1">Pitch Accent Check <span class="muted">· throwaway demo · <a href="/voices" style="color:inherit">voices</a></span></h1>
  </header>

  <section class="card">
    <span class="lvbadge" id="lvbadge"></span>
    <div id="members" class="members" hidden></div>
    <div id="sentence" class="sentence">…</div>
    <div id="meaning" class="meaning"></div>
    <div id="guidewrap" hidden>
      <div class="rowlabel" style="margin-top:10px">Pitch guide</div>
      <div class="pitchrow" id="guide"></div>
    </div>
    <div class="rowlabel" style="margin-top:18px">Listen &amp; shadow</div>
    <div class="voices" id="voicesTop"></div>
    <div class="controls">
      <button id="rec" class="rec">● Record</button>
      <button id="mine" disabled>▶ My recording</button>
      <span id="status" class="muted"></span>
      <span class="muted" style="margin-left:auto">Voice speed <input type="range" id="speed" min="0.6" max="1.2" step="0.05" value="0.9" style="width:120px;vertical-align:middle"> <span id="speedval">0.90×</span></span>
    </div>
    <div id="error" class="error" hidden></div>
  </section>

  <section class="card" id="results" hidden>
    <div class="score" id="score"></div>
    <div class="pairres" id="pairres" hidden></div>
    <div class="rowlabel">Expected</div>
    <div class="voices" id="voicesRes"></div>
    <div class="pitchrow" id="expected"></div>
    <div class="rowlabel">What you said</div>
    <div class="pitchrow heard" id="heard"></div>
    <div class="legend"><span class="l-ok">matched</span><span class="l-bad">wrong pitch</span><span class="l-un">not sure (no verdict)</span><span class="muted">faded = follow-up, not graded</span></div>
    <div class="heardkana" id="heardkana"></div>
    <div class="controls"><button id="next" class="primary">Next sentence →</button></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let attempts = 0, cur = null, recording = false, ctx, proc, src, stream, chunks = [], lastWav = null;

let VOICES = [];
async function loadVoices() {
  VOICES = await (await fetch("/api/voices")).json();
  renderVoices();
}
function renderVoices() {
  for (const box of [$("voicesTop"), $("voicesRes")]) {
    box.innerHTML = VOICES.map(v => `<button data-voice="${v.id}">▶ ${v.name}</button>`).join("");
    box.querySelectorAll("button").forEach(b => b.onclick = () => {
      const was = b.classList.contains("playing");
      document.querySelectorAll(".voices button").forEach(x => x.classList.remove("playing"));
      if (player) player.pause();
      if (was) return;                       // second click = stop
      b.classList.add("playing");
      play(`/api/tts?id=${cur.id}&voice=${b.dataset.voice}&speed=${$("speed").value}`);
      player.onended = player.onpause = () => b.classList.remove("playing");
    });
  }
}

let LEVEL = "N4", MODE = "sentence";
try { LEVEL = localStorage.getItem("level") || "N4"; MODE = localStorage.getItem("mode") || "sentence";
      $("particle").value = localStorage.getItem("particle") || "carrier"; } catch (e) {}
function setMode(m) {
  MODE = m; try { localStorage.setItem("mode", m); } catch (e) {}
  $("modes").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.m === m));
  $("particle").hidden = m !== "word";
}
$("modes").querySelectorAll("button").forEach(b => b.onclick = () => { setMode(b.dataset.m); loadLevels().then(next); });
$("particle").onchange = () => { try { localStorage.setItem("particle", $("particle").value); } catch (e) {} next(); };
setMode(MODE);
async function loadLevels() {
  const ls = await (await fetch(`/api/levels?mode=${MODE}`)).json();
  const opts = [...ls, { level: "any", n: ls.reduce((a, b) => a + b.n, 0) }];
  $("levels").innerHTML = opts.map(l => `<button data-l="${l.level}" class="${l.level === LEVEL ? "on" : ""}" ${l.n ? "" : "disabled"}>${l.level === "any" ? "Any" : l.level}<small>${l.n}</small></button>`).join("");
  $("levels").querySelectorAll("button").forEach(b => b.onclick = () => {
    LEVEL = b.dataset.l; try { localStorage.setItem("level", LEVEL); } catch (e) {}
    $("levels").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); next();
  });
}
async function next() {
  cur = await (await fetch(`/api/item?mode=${MODE}&level=${LEVEL}&particle=${$("particle").value}`)).json();
  $("lvbadge").textContent = cur.level === "N1+" && MODE !== "sentence" ? "not on JLPT lists" : `JLPT ${cur.level}`;
  $("meaning").textContent = MODE === "word" && cur.meaning ? cur.meaning : "";
  $("members").hidden = MODE !== "pair";
  if (MODE === "pair") {
    $("members").innerHTML = cur.members.map(m => `<div class="member ${m.target ? "target" : ""}">
      ${m.target ? `<div class="say">SAY THIS ONE</div>` : ""}<div class="w">${m.word}</div><div class="r">${m.reading}</div>
      <div class="g">${(m.gloss || "").split(";")[0]}</div></div>`).join("");
  }
  $("sentence").innerHTML = cur.furigana.map(([s, r]) => r ? `<ruby>${s}<rt>${r}</rt></ruby>` : s).join("");
  $("results").hidden = true; $("error").hidden = true; $("status").textContent = "";
  $("mine").disabled = true; lastWav = null; recBlob = null;
  attempts = 0; $("guidewrap").hidden = true;
  $("guide").innerHTML = cur.phrases.map(p => pitchHTML(p.pattern, p.moras, "", [], p)).join("");
  $("rec").disabled = false; $("rec").innerHTML = "● Record";
}

function tipHTML(p) {
  const line = p.type ? `${p.word ? `${p.word}: ` : ""}${p.type_kanji} <i>(${p.type})</i> · [${p.acc}]` : `[${p.acc}]`;
  const gl = (p.glosses || []).map(([w, g]) => `<span class="tipgloss"><span class="tw">${w}</span>${g}</span>`).join("");
  return `<span class="tip"><b>${p.surface}</b><span class="tipline">${line}</span>`
    + (p.note ? `<span class="tipnote">${p.note}</span>` : "") + (gl ? `<span class="tipsep"></span>${gl}` : "") + `</span>`;
}
function pitchHTML(pattern, moras, cls = "", bad = [], tip = null) {
  return `<span class="phrase ${cls}${tip ? " hastip" : ""}" tabindex="${tip ? 0 : -1}">` + (tip ? tipHTML(tip) : "") + moras.map((m, j) => {
    const lv = pattern[j], step = j > 0 && pattern[j - 1] !== lv ? " step" : "";
    return `<span class="m ${lv}${step}${bad.includes(j) ? " bad" : ""}">${m}</span>`;
  }).join("") + (cls === "unsure" ? `<span class="badge">?</span>` : "") + `</span>`;
}

function show(res) {
  $("score").innerHTML = res.score === null ? "–<small>couldn't judge it confidently</small>"
    : `${res.score}%<small>${res.phrases.filter(p => p.verdict === "ok").length} of ${res.phrases.filter(p => p.verdict !== "unsure").length} phrases`
      + (res.n_unsure ? ` · ${res.n_unsure} not sure` : "") + `</small>`;
  $("expected").innerHTML = cur.phrases.map(p => pitchHTML(p.pattern, p.moras, "", [], p)).join("");
  $("heard").innerHTML = res.phrases.map((r, i) => pitchHTML(r.heard_pattern, cur.phrases[i].moras, r.verdict, r.wrong_morae)).join("");
  $("pairres").hidden = !res.pair;
  if (res.pair) {
    const tgt = cur.members.find(m => m.target), heard = cur.members.find(m => m.word === res.pair.heard);
    $("pairres").innerHTML = !heard ? `Couldn't tell which one you said — try exaggerating the pitch a little.`
      : heard.word === tgt.word ? `✓ You said <b>${tgt.word}</b> (${tgt.type_kanji})`
      : `✗ That sounded like <b>${heard.word}</b> (${heard.type_kanji}), not <b>${tgt.word}</b> (${tgt.type_kanji})`;
    // reveal all members' patterns
    $("members").innerHTML = cur.members.map(m => `<div class="member ${m.target ? "target" : ""}">
      <div class="w">${m.word}</div><div class="r">${m.reading}</div><div class="g">${m.type_kanji} · [${m.acc}]</div>
      <div class="pitchrow" style="font-size:16px">${pitchHTML(m.pattern, [...m.reading.split(""), ...(m.pattern.length > m.reading.length ? ["が"] : [])])}</div></div>`).join("");
  }
  $("heardkana").textContent = "Heard (kana recogniser): " + res.heard_kana;
  $("results").hidden = false;
}

// ---- recording: MediaRecorder (runs off the main thread, no dropouts) -> decode -> 16 kHz WAV
let mediaRec = null, recBlob = null;
async function startRec() {
  if (attempts >= 1) $("guidewrap").hidden = false;   // pitch guide from the 2nd attempt on
  stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  chunks = [];
  mediaRec = new MediaRecorder(stream);
  mediaRec.ondataavailable = e => e.data.size && chunks.push(e.data);
  mediaRec.start(250);  // flush every 250 ms so nothing is held back at stop
  recording = true; $("rec").innerHTML = `<span class="dot"></span>Stop`; $("status").textContent = "Recording…";
  $("results").hidden = true; $("error").hidden = true;
}

function wavBlob(samples, rate) {
  const buf = new ArrayBuffer(44 + samples.length * 2), v = new DataView(buf);
  const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); v.setUint32(4, 36 + samples.length * 2, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true);
  v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data");
  v.setUint32(40, samples.length * 2, true);
  samples.forEach((s, i) => v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, s)) * 0x7fff, true));
  return new Blob([buf], { type: "audio/wav" });
}

async function stopRec() {
  recording = false;
  attempts++;
  const stopped = new Promise(r => mediaRec.onstop = r);
  mediaRec.stop(); await stopped;
  stream.getTracks().forEach(t => t.stop());
  recBlob = new Blob(chunks, { type: mediaRec.mimeType });
  $("mine").disabled = false;
  $("rec").disabled = true; $("rec").innerHTML = "● Record"; $("status").textContent = "Scoring…";
  try {
    const dctx = new AudioContext({ sampleRate: 16000 });
    const audio = await dctx.decodeAudioData(await recBlob.arrayBuffer());
    await dctx.close();
    lastWav = wavBlob(audio.getChannelData(0), audio.sampleRate);
    $("status").textContent = `Scoring… (${audio.duration.toFixed(1)} s)`;
    const res = await (await fetch(`/api/grade?id=${cur.id}`, { method: "POST", body: lastWav })).json();
    $("status").textContent = "";
    if (res.error) { $("error").textContent = res.error + (res.heard ? ` (heard: ${res.heard})` : ""); $("error").hidden = false; }
    else show(res);
  } catch (e) { $("error").textContent = "Scoring failed: " + e; $("error").hidden = false; $("status").textContent = ""; }
  $("rec").disabled = false; $("rec").innerHTML = "● Try again";
}

let player = null;  // keep a reference so playback isn't garbage-collected mid-clip
function play(src) { if (player) player.pause(); player = new Audio(src); player.play(); }

$("rec").onclick = () => recording ? stopRec() : startRec();
$("mine").onclick = () => recBlob && play(URL.createObjectURL(recBlob));
$("next").onclick = next;
// remember the chosen speed across sentences and reloads
try { const v = localStorage.getItem("speed"); if (v) $("speed").value = v; } catch (e) {}
const showSpeed = () => { $("speedval").textContent = Number($("speed").value).toFixed(2) + "×"; };
$("speed").oninput = () => { showSpeed(); try { localStorage.setItem("speed", $("speed").value); } catch (e) {} };
showSpeed();
Promise.all([loadVoices(), loadLevels()]).then(next);
</script>
</body>
</html>
